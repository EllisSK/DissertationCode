[project]
name = "dissertationcode"
version = "0.1.0"
description = "Experimental and numerical investigation of the hydraulics of leaky barriers: discharge models, uncertainty analysis and a 1D shallow-water flume solver"
readme = "README.md"
license = "GPL-2.0-only"
authors = [{ name = "Ellis Sinclair-Kent", email = "ellissinclairkent@gmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "kaleido>=1.2.0",
    "matplotlib>=3.10.8",
    "numpy>=2.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.0",
    "plotly>=6.5.2",
    "scipy>=1.17.0",
    "tqdm>=4.67.1",
]

[project.urls]
Repository = "https://github.com/EllisSK/DissertationCode"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
